name: CI

# Kører simulatoren på hver pull request mod main. Jobbet "Simulator" er et krævet tjek
# i branch-beskyttelsen, så en PR kan først merges, når det er grønt.

on:
  pull_request:
    branches: [main]

jobs:
  sim:
    name: Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # simulatoren henter den udgivne 0.14 fra tagget (tools/sim/sim.py, OLD)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Simulator
        run: |
          pip install lupa
          python tools/sim/sim.py
